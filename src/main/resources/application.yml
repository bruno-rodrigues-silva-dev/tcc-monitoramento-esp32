spring:
  application:
    name: monitoramento
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/monitoramento}
    username: ${DB_USER:monitoramento}
    password: ${DB_PASSWORD:monitoramento}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${PORT:8080}

# Parâmetros do sistema (definidos na metodologia do TCC)
monitoramento:
  temperatura:
    alerta: 50.0        # °C
    critico: 60.0       # °C
    histerese: 2.0      # °C
  corrente:
    alerta: 1.6         # A (RMS)
    critico: 2.0        # A (RMS)
    histerese: 0.0      # A
  estatistica:
    sigmas: 3.0         # média + 3 desvios-padrão
    margem: 0.05        # A, somada ao limite estatístico
    consecutivas: 3     # leituras consecutivas acima do limite
    janela: 120         # nº máximo de leituras na linha de base
    min-amostras: 30    # leituras necessárias antes de a estatística valer
  timeout-comunicacao: 15s
  verificacao-comunicacao-ms: 5000

# Sobe o PostgreSQL sozinho (docker-compose.yml) ao rodar a API pelo IntelliJ.
# Requer o Docker Desktop aberto. O banco continua ligado quando a API para.
spring.docker.compose.lifecycle-management: start-only
